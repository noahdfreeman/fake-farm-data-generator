name: AgrowKnow reusable checks
on:
  workflow_call:
    inputs:
      public-env:
        type: string
        default: '{}'

permissions:
  contents: read

jobs:
  checks:
    name: Checks and sealed artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AGROWKNOW_PUBLIC_BUILD_ENV: ${{ inputs.public-env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.33.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate workflow syntax and expressions
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Validate versioned workflow contract
        id: contract
        run: node scripts/agrowknow-ci/run.mjs validate
      - name: Run the owning product's checks
        run: node scripts/agrowknow-ci/run.mjs all
      - name: Retain the exact checked artifact and release receipt
        if: steps.contract.outputs.has-artifact == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.contract.outputs.product }}-${{ github.sha }}
          path: ${{ steps.contract.outputs.artifact-directory }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
