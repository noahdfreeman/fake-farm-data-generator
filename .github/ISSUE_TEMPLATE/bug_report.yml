name: Bug report
description: Report a reproducible plugin or generated-output problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real grower data, credentials, or private field outputs.
  - type: input
    id: qgis
    attributes:
      label: QGIS version and operating system
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual and expected result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or manifest excerpt
